<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Milan Sony · Links</title>
    <meta name="description" content="Milan Sony: all my social links in one place." />
    <meta name="author" content="Milan Sony" />
    <link rel="canonical" href="https://milan-sony.github.io/sociallinks/" />

    <!-- Link preview (WhatsApp, LinkedIn, Facebook, Discord, iMessage...).
         Crawlers need absolute URLs. Image source: scripts/og/og-image.html -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Milan Sony" />
    <meta property="og:title" content="Milan Sony · Links" />
    <meta property="og:description" content="Self-taught developer from India. Portfolio, GitHub, LinkedIn, Instagram and more, all in one place." />
    <meta property="og:url" content="https://milan-sony.github.io/sociallinks/" />
    <meta property="og:image" content="https://milan-sony.github.io/sociallinks/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Milan Sony, self-taught developer from India." />
    <meta property="og:locale" content="en_IN" />
    <meta property="profile:first_name" content="Milan" />
    <meta property="profile:last_name" content="Sony" />

    <!-- X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@milansony_" />
    <meta name="twitter:creator" content="@milansony_" />
    <meta name="twitter:title" content="Milan Sony · Links" />
    <meta name="twitter:description" content="Self-taught developer from India. Portfolio, GitHub, LinkedIn, Instagram and more, all in one place." />
    <meta name="twitter:image" content="https://milan-sony.github.io/sociallinks/og-image.jpg" />
    <meta name="twitter:image:alt" content="Milan Sony, self-taught developer from India." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/profile.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        const t = localStorage.getItem('theme')
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
    <style>
      /* Preloader: inline so it paints before any JS or CSS bundle loads. */
      html { background: oklch(1 0 0); color-scheme: light; }
      html.dark { background: oklch(0.165 0 0); color-scheme: dark; }
      #preloader {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        background: oklch(1 0 0); color: oklch(0.145 0 0);
        transition: opacity .5s cubic-bezier(.2,.8,.2,1), filter .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1);
      }
      html.dark #preloader { background: oklch(0.165 0 0); color: oklch(0.96 0 0); }
      #preloader.done { opacity: 0; filter: blur(6px); transform: scale(1.02); pointer-events: none; }
      .pl-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .pl-name {
        font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif;
        font-size: clamp(34px, 7vw, 52px); line-height: 1; letter-spacing: -0.01em;
        animation: pl-in .8s cubic-bezier(.2,.8,.2,1) both;
      }
      .pl-sub {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: .5;
        animation: pl-in .8s .15s cubic-bezier(.2,.8,.2,1) both;
      }
      .pl-bar {
        position: relative; width: 120px; height: 1px; overflow: hidden;
        background: color-mix(in oklch, currentColor 12%, transparent);
        animation: pl-in .8s .25s cubic-bezier(.2,.8,.2,1) both;
      }
      .pl-bar::after {
        content: ''; position: absolute; inset: 0; width: 40%;
        background: currentColor;
        animation: pl-slide 1.1s cubic-bezier(.65,0,.35,1) infinite;
      }
      @keyframes pl-in { from { opacity: 0; transform: translateY(6px); filter: blur(4px); } }
      @keyframes pl-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .pl-name, .pl-sub, .pl-bar, .pl-bar::after { animation: none; }
        #preloader { transition: opacity .2s; }
        #preloader.done { filter: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Loading">
      <div class="pl-inner">
        <span class="pl-name">Milan Sony</span>
        <span class="pl-sub">Links</span>
        <span class="pl-bar"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
